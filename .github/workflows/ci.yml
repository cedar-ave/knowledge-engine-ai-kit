name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate samples
        run: npm run validate
      - name: Leak check
        run: node scripts/leak-check.mjs
      - name: Generated files are current
        shell: bash
        run: |
          node scripts/gen-schemas.mjs
          node scripts/gen-samples.mjs
          node scripts/gen-fixtures.mjs
          git status --porcelain
          test -z "$(git status --porcelain)"
